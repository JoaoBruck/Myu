<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#171529" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>MYU — 17:40 Prototype</title>
<link rel="manifest" href="manifest.webmanifest" />
<style>
  :root{--ink:#171529;--paper:#c8c0d0;--warm:#f3b26f;--cool:#777ca8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171529;color:white;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none;overscroll-behavior:none;user-select:none}
  #game{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#171529}
  #hud{position:fixed;inset:0;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));text-shadow:0 2px 0 #171529,2px 0 0 #171529,-2px 0 0 #171529}
  #title{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));font-size:12px;letter-spacing:.18em;opacity:.88}
  #title b{color:#e9c1b2;font-weight:700}
  #hint{position:absolute;right:max(14px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));font-size:10px;line-height:1.45;text-align:right;opacity:.72}
  #prompt{position:absolute;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom) + 8px));transform:translateX(-50%);padding:7px 10px;background:#171529d9;border:1px solid #aca8c155;border-radius:8px;font-size:11px;opacity:0;transition:opacity .12s;white-space:nowrap}
  #prompt.show{opacity:1}
  #orientation{display:none;position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);padding:8px 10px;background:#171529c9;border:1px solid #ffffff22;border-radius:8px;font-size:10px;opacity:.72}
  #controls{position:fixed;inset:0;pointer-events:none;padding-bottom:env(safe-area-inset-bottom)}
  #stick{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));width:124px;height:124px;border-radius:50%;pointer-events:auto;touch-action:none;opacity:.86}
  #stickBase{position:absolute;left:22px;top:22px;width:80px;height:80px;border:2px solid #c9c4da35;background:#17152945;border-radius:50%;box-shadow:inset 0 0 0 10px #ffffff05}
  #stickKnob{position:absolute;left:44px;top:44px;width:36px;height:36px;border-radius:50%;background:#b7b4ca55;border:2px solid #e2deea33;transform:translate(0,0)}
  #action{position:absolute;right:max(20px,calc(env(safe-area-inset-right) + 8px));bottom:max(26px,calc(env(safe-area-inset-bottom) + 16px));width:74px;height:74px;border-radius:50%;border:2px solid #e6c3b044;background:#5e405d99;color:#f7ded0;font:700 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace;display:grid;place-items:center;pointer-events:auto;touch-action:none;box-shadow:inset 0 0 0 8px #ffffff07,0 8px 22px #0005}
  #action:active{transform:scale(.94);background:#765470bb}
  #action small{display:block;font-size:7px;font-weight:600;letter-spacing:.08em;margin-top:2px;opacity:.75}
  #actionWrap{display:flex;flex-direction:column;align-items:center;gap:2px}
  @media (hover:hover) and (pointer:fine){#controls{display:none}#hint{display:block}}
  @media (hover:none),(pointer:coarse){#hint{display:none}}
  @media (orientation:portrait) and (max-width:700px){#orientation{display:block;animation:fadeaway 3.8s forwards 1.2s}@keyframes fadeaway{to{opacity:0;visibility:hidden}}}
</style>
</head>
<body>
<canvas id="game" aria-label="Protótipo jogável de Myu"></canvas>
<div id="hud">
  <div id="title"><b>MYU</b> // 17:40</div>
  <div id="hint">WASD / setas · mover<br>E / espaço · interagir</div>
  <div id="prompt"></div>
  <div id="orientation">Funciona em pé — mas fica melhor em paisagem.</div>
</div>
<div id="controls">
  <div id="stick"><div id="stickBase"></div><div id="stickKnob"></div></div>
  <button id="action" aria-label="Interagir"><span id="actionWrap">A<small>agir</small></span></button>
</div>
<script>
(() => {
'use strict';
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha:false });
const promptEl = document.getElementById('prompt');
const stick = document.getElementById('stick');
const knob = document.getElementById('stickKnob');
const actionBtn = document.getElementById('action');
ctx.imageSmoothingEnabled = false;

const C = {
  sky:'#46476f', sky2:'#65628a', dusk:'#b06c7c', sun:'#e6a46e', far:'#292a4a', far2:'#38395e',
  road:'#24283f', road2:'#2d314b', curb:'#66667c', walk:'#595a70', walk2:'#68687e',
  wall:'#39364f', wall2:'#49435d', trim:'#24233a', glass:'#7d514f', warm:'#e8a25f', warm2:'#f5c47f',
  leaf:'#844259', leaf2:'#9c5065', plant:'#52624f', rail:'#26253a', ink:'#171529', white:'#d9d5df',
  coat:'#3f304c', coat2:'#54405e', scarf:'#62688a', skirt:'#6b596f', skin:'#d9a5a3', hair:'#2b1d2d', hair2:'#3b273b', bag:'#4b342f', charm:'#ecd1ad'
};

let logicalScale = 3;
let vw=0,vh=0;
function resize(){
  const w = Math.max(240, window.innerWidth);
  logicalScale = w < 520 ? 2 : (w < 1100 ? 3 : 4);
  vw = Math.floor(window.innerWidth / logicalScale);
  vh = Math.floor(window.innerHeight / logicalScale);
  canvas.width = vw; canvas.height = vh;
  canvas.style.width = window.innerWidth+'px'; canvas.style.height = window.innerHeight+'px';
  ctx.imageSmoothingEnabled=false;
}
addEventListener('resize', resize, {passive:true}); resize();

const input = {left:false,right:false,up:false,down:false,joyX:0,joyY:0,action:false};
const keys = new Set();
addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key)) e.preventDefault();
  keys.add(e.key.toLowerCase());
  if(['e',' ','enter'].includes(e.key.toLowerCase())) input.action=true;
});
addEventListener('keyup', e=>keys.delete(e.key.toLowerCase()));

let joyPointer=null, joyOrigin={x:62,y:62};
function joyUpdate(e){
  const r=stick.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  let dx=x-joyOrigin.x, dy=y-joyOrigin.y;
  const max=34, mag=Math.hypot(dx,dy)||1;
  if(mag>max){dx=dx/mag*max;dy=dy/mag*max;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  input.joyX=dx/max; input.joyY=dy/max;
}
stick.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;stick.setPointerCapture(e.pointerId);joyUpdate(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joyUpdate(e);});
function joyEnd(e){if(e.pointerId!==joyPointer)return;joyPointer=null;input.joyX=input.joyY=0;knob.style.transform='translate(0,0)';}
stick.addEventListener('pointerup',joyEnd);stick.addEventListener('pointercancel',joyEnd);
actionBtn.addEventListener('pointerdown',e=>{e.preventDefault();input.action=true;if(navigator.vibrate)navigator.vibrate(8);});

function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function lerp(a,b,t){return a+(b-a)*t;}
function rect(x,y,w,h,fill){ctx.fillStyle=fill;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function line(x1,y1,x2,y2,fill,w=1){ctx.strokeStyle=fill;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(Math.round(x1)+.5,Math.round(y1)+.5);ctx.lineTo(Math.round(x2)+.5,Math.round(y2)+.5);ctx.stroke();}
function circle(x,y,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.arc(Math.round(x),Math.round(y),r,0,Math.PI*2);ctx.fill();}

const exterior={name:'exterior',w:1160,h:760,spawn:{x:430,y:550},door:{x:665,y:328,r:24,label:'Entrar no café'}};
const interior={name:'interior',w:720,h:500,spawn:{x:350,y:420},door:{x:352,y:450,r:26,label:'Sair para a rua'}};
let scene=exterior;
const player={x:exterior.spawn.x,y:exterior.spawn.y,vx:0,vy:0,r:6,dir:'down',walk:0};
const cam={x:player.x,y:player.y};

const extObstacles=[
  {x:370,y:135,w:415,h:205}, // café body
  {x:350,y:340,w:82,h:28}, {x:758,y:340,w:42,h:28}, // planters
  {x:475,y:370,w:48,h:20}, // sign
  {x:175,y:290,w:74,h:20}, // bench
  {x:900,y:220,w:18,h:240}, // right rail segment
  {x:1030,y:220,w:18,h:260},
  {x:915,y:205,w:122,h:14},
  {x:870,y:505,w:145,h:14}, // lower railing
  {x:260,y:372,w:12,h:12},{x:297,y:372,w:12,h:12},{x:822,y:380,w:12,h:12},{x:855,y:380,w:12,h:12},
  {x:292,y:205,w:16,h:16}, // lamp
  {x:958,y:295,w:16,h:16}
];
const intObstacles=[
  {x:0,y:0,w:720,h:86},{x:0,y:0,w:72,h:500},{x:648,y:0,w:72,h:500},
  {x:0,y:462,w:310,h:38},{x:390,y:462,w:330,h:38},
  {x:80,y:100,w:440,h:50}, // counter
  {x:90,y:190,w:72,h:52},{x:238,y:200,w:72,h:52},{x:430,y:190,w:72,h:52},
  {x:126,y:300,w:70,h:50},{x:294,y:320,w:70,h:50},{x:476,y:300,w:70,h:50},
  {x:555,y:110,w:58,h:82}
];

function obstacles(){return scene===exterior?extObstacles:intObstacles;}
function circleRectOverlap(px,py,r,o){
  const nx=clamp(px,o.x,o.x+o.w), ny=clamp(py,o.y,o.y+o.h);
  const dx=px-nx,dy=py-ny;return dx*dx+dy*dy<r*r;
}
function movePlayer(dx,dy){
  let nx=player.x+dx;
  for(const o of obstacles()) if(circleRectOverlap(nx,player.y,player.r,o)){ nx=player.x; player.vx=0; break; }
  player.x=clamp(nx,player.r,scene.w-player.r);
  let ny=player.y+dy;
  for(const o of obstacles()) if(circleRectOverlap(player.x,ny,player.r,o)){ ny=player.y; player.vy=0; break; }
  player.y=clamp(ny,player.r,scene.h-player.r);
}

const leaves=Array.from({length:70},(_,i)=>({
  x:(i*137)%exterior.w, y:390+((i*83)%280), s:i%3, t:(i*17)%100
}));
let windT=0;

function getAxis(){
  let x=input.joyX,y=input.joyY;
  if(keys.has('a')||keys.has('arrowleft'))x-=1;
  if(keys.has('d')||keys.has('arrowright'))x+=1;
  if(keys.has('w')||keys.has('arrowup'))y-=1;
  if(keys.has('s')||keys.has('arrowdown'))y+=1;
  const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;} return {x,y};
}
function switchScene(to){
  scene=to;
  player.x=to.spawn.x;player.y=to.spawn.y;player.vx=player.vy=0;
  cam.x=player.x;cam.y=player.y;
}
function interaction(){
  const d=scene.door; const dist=Math.hypot(player.x-d.x,player.y-d.y);
  if(dist<d.r){return d;} return null;
}
function update(dt){
  windT+=dt;
  const a=getAxis();
  const accel=260,max=58,friction=320;
  if(Math.abs(a.x)>0.03||Math.abs(a.y)>0.03){
    player.vx+=a.x*accel*dt;player.vy+=a.y*accel*dt;
    const sp=Math.hypot(player.vx,player.vy);if(sp>max){player.vx=player.vx/sp*max;player.vy=player.vy/sp*max;}
    if(Math.abs(a.x)>Math.abs(a.y))player.dir=a.x<0?'left':'right'; else player.dir=a.y<0?'up':'down';
    player.walk+=dt*Math.min(8,3+sp*.07);
  } else {
    const sp=Math.hypot(player.vx,player.vy);if(sp>0){const ns=Math.max(0,sp-friction*dt);player.vx=sp?player.vx/sp*ns:0;player.vy=sp?player.vy/sp*ns:0;}
  }
  movePlayer(player.vx*dt,0);movePlayer(0,player.vy*dt);
  cam.x=lerp(cam.x,player.x,1-Math.pow(.0005,dt));cam.y=lerp(cam.y,player.y,1-Math.pow(.0005,dt));
  const it=interaction();
  if(it){promptEl.textContent=(matchMedia('(pointer:coarse)').matches?'A':'E')+' · '+it.label;promptEl.classList.add('show');}
  else promptEl.classList.remove('show');
  if(input.action){
    if(it){ switchScene(scene===exterior?interior:exterior); if(navigator.vibrate)navigator.vibrate(16); }
    input.action=false;
  }
}

function beginWorld(){
  const maxX=Math.max(vw/2,scene.w-vw/2),maxY=Math.max(vh/2,scene.h-vh/2);
  const cx=clamp(cam.x,vw/2,maxX), cy=clamp(cam.y,vh/2,maxY);
  ctx.save();ctx.translate(Math.floor(vw/2-cx),Math.floor(vh/2-cy));return {cx,cy};
}
function endWorld(){ctx.restore();}

function drawSkyline(){
  rect(0,0,1160,170,C.sky);
  rect(0,80,1160,90,C.sky2);
  circle(1000,105,32,C.sun);
  for(let i=0;i<18;i++){
    const x=10+i*68+(i%3)*13,h=45+(i*37)%85,y=170-h;
    rect(x,y,55,h,i%2?C.far:C.far2);
    if(i%2===0) for(let wy=y+14;wy<160;wy+=18) if((wy+i)%3) rect(x+12,wy,3,5,C.warm);
  }
  rect(0,165,1160,16,'#292a42');
}
function drawExteriorBase(){
  drawSkyline();
  rect(0,180,1160,580,C.road);
  // distant park / embankment
  rect(0,180,1160,95,'#353750');
  rect(0,275,1160,260,C.walk);
  // roads
  rect(0,535,1160,225,C.road);
  rect(0,525,1160,10,C.curb);
  rect(0,695,1160,8,C.curb);
  // sidewalk tile seams
  ctx.globalAlpha=.25;
  for(let x=0;x<1160;x+=28) line(x,275,x,525,'#9895a3');
  for(let y=275;y<525;y+=24) line(0,y,1160,y,'#8c899b');
  ctx.globalAlpha=1;
  // crosswalk
  for(let i=0;i<6;i++) rect(35+i*34,600,20,66,'#b8b6c055');
  // wet patches
  rect(110,555,145,7,'#484b66');rect(115,562,110,4,'#3f435f');
  rect(760,576,130,5,'#4b4e69');rect(785,582,86,3,'#3f435f');
  // cafe body
  rect(370,135,415,205,C.wall);
  rect(380,150,395,48,C.wall2);
  rect(360,190,435,18,C.trim);
  // awning
  rect(390,198,375,38,'#2f304c');
  for(let x=390;x<765;x+=18) rect(x,232,11,5,'#26263e');
  // windows
  rect(405,245,104,88,'#2a293c');rect(514,245,112,88,'#2a293c');rect(631,245,88,88,'#2a293c');
  rect(410,250,94,78,C.glass);rect(519,250,102,78,C.glass);rect(636,250,78,78,C.glass);
  ctx.globalAlpha=.72;rect(410,250,94,78,C.warm);rect(519,250,102,78,C.warm);rect(636,250,78,78,C.warm);ctx.globalAlpha=1;
  // mullions
  line(456,250,456,328,C.trim,2);line(570,250,570,328,C.trim,2);line(674,250,674,328,C.trim,2);
  // door
  rect(720,242,48,98,C.trim);rect(726,248,36,84,'#694e58');rect(733,257,22,50,C.warm);
  rect(752,291,3,3,C.charm);
  // warm lamps
  for(const lx of [438,550,663]){line(lx,250,lx,263,'#33283a');rect(lx-5,262,10,5,'#33283a');rect(lx-3,267,6,4,C.warm2);}
  // interior tables silhouettes
  rect(428,300,34,6,'#6a4a43');rect(433,306,4,14,'#6a4a43');rect(455,306,4,14,'#6a4a43');
  rect(540,302,40,6,'#6a4a43');rect(544,308,4,13,'#6a4a43');rect(573,308,4,13,'#6a4a43');
  // building top windows
  rect(420,160,64,28,'#26263b');rect(430,166,44,18,'#9c6654');rect(660,160,64,28,'#26263b');rect(670,166,44,18,'#7b5453');
  // ivy
  for(let i=0;i<22;i++){const x=375+(i*53)%408,y=145+(i*29)%88;rect(x,y,5+(i%3)*2,4+(i%2)*2,i%2?C.leaf:C.leaf2);}
  // warm spill
  ctx.globalAlpha=.22;rect(650,335,120,45,C.warm);ctx.globalAlpha=1;
  // left bench
  rect(175,290,74,7,'#342b36');rect(180,298,64,5,'#513c43');rect(182,303,4,16,'#342b36');rect(237,303,4,16,'#342b36');
  // planters
  for(const p of [[350,340,82,28],[758,340,42,28]]){rect(p[0],p[1],p[2],p[3],'#393143');for(let k=0;k<6;k++)rect(p[0]+5+k*11,p[1]-4-(k%2)*4,7,7,k%2?C.plant:C.leaf);}
  // sign
  rect(480,365,38,30,'#26243a');rect(475,390,48,4,'#211f33');line(482,365,477,395,'#211f33',2);line(516,365,521,395,'#211f33',2);
  // tree left
  rect(285,205,11,92,'#342634');rect(260,217,55,7,'#342634');
  for(let i=0;i<26;i++){const a=i*2.4,r=28+(i%6)*5;rect(290+Math.cos(a)*r,215+Math.sin(a)*r*.55,6,5,i%2?C.leaf:C.leaf2);}
  // lamp posts
  drawLamp(292,205);drawLamp(958,295);
  // river overlook rail
  rect(900,220,148,5,C.rail);rect(900,500,148,5,C.rail);rect(900,220,5,285,C.rail);rect(1043,220,5,285,C.rail);
  for(let y=230;y<500;y+=30) rect(900,y,148,2,'#3b394c');
  // water hint
  rect(910,228,128,267,'#303653');ctx.globalAlpha=.25;for(let y=245;y<490;y+=18)rect(920+(y%37),y,70,2,'#8b7990');ctx.globalAlpha=1;
  // bollards
  for(const b of [[260,372],[297,372],[822,380],[855,380]]){rect(b[0],b[1],12,12,'#252538');rect(b[0]+3,b[1]-11,6,12,'#2f2e43');}
  // leaves
  for(const l of leaves){const sway=Math.sin(windT*.7+l.t)*.6;rect(l.x+sway,l.y,2+l.s,1+(l.s>1?1:0),l.s%2?C.leaf:C.leaf2);}
  // lane dashes
  for(let x=300;x<1100;x+=95) rect(x,636,48,3,'#6f6b7433');
}
function drawLamp(x,y){rect(x+5,y,6,78,C.rail);rect(x,y+6,16,4,C.rail);rect(x+1,y-4,14,12,C.rail);rect(x+4,y-1,8,6,C.warm2);ctx.globalAlpha=.15;circle(x+8,y+2,20,C.warm2);ctx.globalAlpha=1;}

function drawInteriorBase(){
  rect(0,0,720,500,'#342e43');
  rect(72,86,576,376,'#7a615d');
  // floorboards
  for(let y=88;y<462;y+=12){rect(72,y,576,1,'#56464c');for(let x=72+((y/12)%2)*24;x<648;x+=48)rect(x,y,1,12,'#5c4a50');}
  // walls
  rect(0,0,720,86,'#494055');rect(0,0,72,500,'#41384e');rect(648,0,72,500,'#41384e');rect(0,462,310,38,'#41384e');rect(390,462,330,38,'#41384e');
  // counter
  rect(80,100,440,50,'#3e3139');rect(84,104,432,12,'#62464a');rect(96,122,408,22,'#503940');
  // shelves + machine
  rect(105,50,240,18,'#2a2636');for(let i=0;i<8;i++)rect(112+i*27,54,10,12,i%2?C.warm:'#8d675b');
  rect(540,100,76,55,'#252536');rect(552,110,22,30,'#777482');rect(580,108,24,34,'#6b5660');
  // lamps
  for(const x of [140,285,430,575]){line(x,85,x,100,'#282434');rect(x-5,98,10,5,'#282434');rect(x-3,103,6,4,C.warm2);ctx.globalAlpha=.08;circle(x,111,32,C.warm2);ctx.globalAlpha=1;}
  // tables
  const tables=[[90,190,72,52],[238,200,72,52],[430,190,72,52],[126,300,70,50],[294,320,70,50],[476,300,70,50]];
  for(const t of tables){rect(t[0],t[1],t[2],t[3],'#5c4747');rect(t[0]+4,t[1]+4,t[2]-8,8,'#775955');rect(t[0]-7,t[1]+10,7,22,'#3d3039');rect(t[0]+t[2],t[1]+10,7,22,'#3d3039');}
  // plants
  for(const [x,y] of [[90,165],[610,170],[600,390]]){rect(x,y,18,15,'#4a3537');for(let i=0;i<6;i++)rect(x+8+(i%2)*5,y-6-i*3,4,7,C.plant);}
  // windows upper side
  for(const x of [110,270,430]){rect(x,12,100,58,'#24253b');rect(x+6,18,88,46,'#4b4b6b');ctx.globalAlpha=.2;rect(x+6,18,88,18,C.dusk);ctx.globalAlpha=1;}
  // doorway
  rect(310,458,80,42,C.trim);rect(324,458,52,18,'#6b4b50');
}

function drawPlayer(){
  const moving=Math.hypot(player.vx,player.vy)>6;
  const step=moving?Math.floor(player.walk)%2:0;
  const x=Math.round(player.x),y=Math.round(player.y);
  const bob=moving&&step?1:0;
  // shadow
  ctx.globalAlpha=.28;rect(x-6,y+7,12,3,'#000');ctx.globalAlpha=1;
  // boots
  rect(x-5,y+4+bob,4,4,C.ink);rect(x+1,y+4+(bob?0:1),4,4,C.ink);
  // skirt/coat body
  rect(x-6,y-7+bob,12,12,C.coat);rect(x-5,y-2+bob,10,8,C.skirt);
  // scarf
  rect(x-6,y-9+bob,12,4,C.scarf);rect(x+2,y-6+bob,3,6,C.scarf);
  // head
  rect(x-4,y-15+bob,8,7,C.skin);
  // hair mass + bun by direction
  rect(x-5,y-17+bob,10,5,C.hair);rect(x-6,y-15+bob,3,5,C.hair2);rect(x+3,y-15+bob,3,4,C.hair);
  if(player.dir==='left')rect(x+4,y-19+bob,4,4,C.hair); else rect(x-8,y-19+bob,4,4,C.hair);
  // face tiny
  if(player.dir!=='up'){
    const eyeY=y-13+bob; if(player.dir==='left')rect(x-3,eyeY,1,1,C.ink);else if(player.dir==='right')rect(x+2,eyeY,1,1,C.ink);else{rect(x-2,eyeY,1,1,C.ink);rect(x+2,eyeY,1,1,C.ink);}
  }
  // bag
  rect(x+5,y-2+bob,4,5,C.bag);rect(x+7,y+2+bob,1,1,C.charm);
}

function drawScene(){
  ctx.fillStyle=C.ink;ctx.fillRect(0,0,vw,vh);
  beginWorld();
  if(scene===exterior)drawExteriorBase();else drawInteriorBase();
  drawPlayer();
  endWorld();
  // vignette
  const g=ctx.createRadialGradient(vw/2,vh/2,Math.min(vw,vh)*.2,vw/2,vh/2,Math.max(vw,vh)*.75);
  g.addColorStop(0,'#0000');g.addColorStop(1,'#0a091655');ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.035,(now-last)/1000);last=now;update(dt);drawScene();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
})();
</script>
</body>
</html>
