name: Validate Lume Godot
on:
  push:
    branches: [main, godot/rebuild, "codex/**"]
    paths: ["godot/**", ".github/workflows/godot-validate.yml"]
  pull_request:
    paths: ["godot/**", ".github/workflows/godot-validate.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import and check physics
        run: |
          set -euo pipefail
          GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT_BIN" --headless --path godot --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" /tmp/import.log
          "$GODOT_BIN" --headless --path godot --script res://tests/test_lume.gd 2>&1 | tee /tmp/tests.log
          grep -Eq "MYU_TEST_RESULT checks=[0-9]+ failures=0" /tmp/tests.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" /tmp/tests.log
      - name: Render cold ambience, weather, depth and side gait
        run: |
          set -euo pipefail
          mkdir -p /tmp/lume-preview
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          xvfb-run -a -s "-screen 0 1280x720x24" /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path godot --audio-driver Dummy --script res://tools/capture_preview.gd -- /tmp/lume-preview 2>&1 | tee /tmp/render.log
          grep -q "MYU_RENDER_CAPTURE_OK" /tmp/render.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" /tmp/render.log
      - name: Encode motion preview
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -v error -framerate 12 -i /tmp/lume-preview/motion_%03d.png -vf "scale=384:384:flags=neighbor,split[a][b];[a]palettegen[p];[b][p]paletteuse" /tmp/lume-preview/lume-walk.gif
          rm /tmp/lume-preview/motion_*.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-validation
          path: |
            /tmp/import.log
            /tmp/tests.log
            /tmp/render.log
            /tmp/lume-preview/*.png
            /tmp/lume-preview/*.gif
