name: Deploy MYU v15 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare MYU v15
        shell: bash
        run: |
          rm -rf _site _extract _extract_v15
          mkdir -p _site _extract _extract_v15
          unzip -q MYU_17_40_prototype_v15.zip -d _extract
          cp -a _extract/MYU_17_40_prototype_v15/. _site/
          mkdir -p _site/v15
          unzip -q MYU_17_40_prototype_v15.zip -d _extract_v15
          cp -a _extract_v15/MYU_17_40_prototype_v15/. _site/v15/
          test -f _site/index.html
          test -f _site/game.js
          test -f _site/assets/sprites/barista_idle.png
          test -f _site/data/audio.json
          test -f _site/v15/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
