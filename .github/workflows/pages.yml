name: Deploy MYU v9 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare MYU v9
        shell: bash
        run: |
          rm -rf _site _extract _extract_v9
          mkdir -p _site _extract _extract_v9
          unzip -q MYU_17_40_prototype_v9.zip -d _extract
          if [ -d "_extract/MYU_17_40_prototype_v9" ]; then
            cp -a _extract/MYU_17_40_prototype_v9/. _site/
          else
            cp -a _extract/. _site/
          fi

          mkdir -p _site/v9
          unzip -q MYU_17_40_prototype_v9.zip -d _extract_v9
          if [ -d "_extract_v9/MYU_17_40_prototype_v9" ]; then
            cp -a _extract_v9/MYU_17_40_prototype_v9/. _site/v9/
          else
            cp -a _extract_v9/. _site/v9/
          fi

          test -f _site/index.html
          test -f _site/game.js
          test -f _site/assets/backgrounds/exterior.webp
          test -f _site/assets/sprites/witch_walk_atlas.webp
          test -f _site/v9/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
