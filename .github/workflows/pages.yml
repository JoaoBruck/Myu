name: Deploy MYU + Outdoor Lab v4

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Prepare stable root
        shell: bash
        run: |
          rm -rf _site _stable _lab
          mkdir -p _site _stable _lab
          unzip -q MYU_17_40_prototype_v15.zip -d _stable
          if [ -d "_stable/MYU_17_40_prototype_v15" ]; then
            cp -a _stable/MYU_17_40_prototype_v15/. _site/
          else
            cp -a _stable/. _site/
          fi

      - name: Prepare outdoor lab v4
        shell: bash
        run: |
          unzip -q MYU_outdoor_lab_v4.zip -d _lab
          mkdir -p _site/phaser _site/streetlab
          cp -a _lab/MYU_outdoor_lab_v4/. _site/phaser/
          cp -a _lab/MYU_outdoor_lab_v4/. _site/streetlab/

          test -f _site/phaser/index.html
          test -f _site/phaser/src/main.js
          test -f _site/phaser/data/world.json
          test -f _site/phaser/assets/backgrounds/exterior.webp
          test -f _site/phaser/assets/sprites/witch_walk_atlas.webp
          test -f _site/phaser/test_report.txt

          grep -q '"speed": 54' _site/phaser/data/world.json
          grep -q '"spriteScale": 0.4' _site/phaser/data/world.json
          grep -q '"buildingHitboxes"' _site/phaser/data/world.json
          grep -q 'this.matter.add.rectangle' _site/phaser/src/main.js
          grep -q 'matter.world.setBounds' _site/phaser/src/main.js
          grep -q 'window.__MYU_SCENE__' _site/phaser/src/main.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
