name: Deploy MYU v7 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare MYU v7
        shell: bash
        run: |
          rm -rf _site _extract _extract_v7
          mkdir -p _site _extract _extract_v7
          unzip -q MYU_17_40_prototype_v7.zip -d _extract
          if [ -d "_extract/MYU_17_40_prototype_v7" ]; then
            cp -a _extract/MYU_17_40_prototype_v7/. _site/
          else
            cp -a _extract/. _site/
          fi

          mkdir -p _site/v7
          unzip -q MYU_17_40_prototype_v7.zip -d _extract_v7
          if [ -d "_extract_v7/MYU_17_40_prototype_v7" ]; then
            cp -a _extract_v7/MYU_17_40_prototype_v7/. _site/v7/
          else
            cp -a _extract_v7/. _site/v7/
          fi

          cat > _site/sw.js <<'EOF'
          const CACHE='myu-v7-live';
          self.addEventListener('install',()=>self.skipWaiting());
          self.addEventListener('activate',event=>{
            event.waitUntil((async()=>{
              const keys=await caches.keys();
              await Promise.all(keys.map(k=>caches.delete(k)));
              await self.clients.claim();
            })());
          });
          self.addEventListener('fetch',event=>{
            if(event.request.method!=='GET') return;
            event.respondWith(fetch(event.request).catch(()=>caches.match(event.request)));
          });
          EOF
          cp _site/sw.js _site/v7/sw.js

          test -f _site/index.html
          test -f _site/game.js
          test -f _site/assets/backgrounds/exterior.webp
          test -f _site/assets/sprites/witch_walk_atlas.webp
          test -f _site/v7/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
