name: Deploy MYU + Labs

on:
  push:
    branches: [main, godot/rebuild]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Bootstrap original HD Lume scene
        if: ${{ hashFiles('godot/assets/lume_cafe_hd.png') == '' }}
        env:
          MYU_HD_ASSET_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-8a38-820e-a143-ed33936ce1f6/raw?se=2026-09-23T02%3A30%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=3775e68b-5556-5d64-b55f-5a991a9e5376&skoid=127c13cb-e695-43ea-b6b2-0a863d41dbf7&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T22%3A59%3A22Z&ske=2026-09-23T22%3A59%3A22Z&sks=b&skv=2026-02-06&sig=450QiyBAPy3cAjIr5CVojjfJvzFG8W08dOt412QhIf4%3D"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/assets
          curl -L --fail --retry 3 "$MYU_HD_ASSET_URL" -o godot/assets/lume_cafe_hd.png
          test "$(stat -c%s godot/assets/lume_cafe_hd.png)" -gt 2000000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add godot/assets/lume_cafe_hd.png
          git commit -m "Add original HD Lume Cafe scene [skip ci]"
          git push origin HEAD:main

      - name: Prepare stable MYU root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _stable _lab
          mkdir -p _site _stable _lab
          unzip -q MYU_17_40_prototype_v15.zip -d _stable
          if [ -d "_stable/MYU_17_40_prototype_v15" ]; then
            cp -a _stable/MYU_17_40_prototype_v15/. _site/
          else
            cp -a _stable/. _site/
          fi

      - name: Prepare outdoor Phaser lab
        shell: bash
        run: |
          set -euo pipefail
          unzip -q MYU_outdoor_lab_v3.zip -d _lab
          mkdir -p _site/phaser _site/streetlab
          if [ -d "_lab/MYU_outdoor_lab_v3" ]; then
            cp -a _lab/MYU_outdoor_lab_v3/. _site/phaser/
            cp -a _lab/MYU_outdoor_lab_v3/. _site/streetlab/
          else
            cp -a _lab/. _site/phaser/
            cp -a _lab/. _site/streetlab/
          fi
          test -f _site/phaser/index.html
          test -f _site/phaser/src/main.js
          test -f _site/phaser/data/world.json
          grep -q '"walkSpeed": 50' _site/phaser/data/world.json

      - name: Install Godot 4.7.2 and Web templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          curl -L --fail --retry 3 -o /tmp/godot_templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q /tmp/godot_templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Validate and build Godot HD pixel version
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/godot
          test -f godot/assets/lume_cafe_hd.png
          test "$(stat -c%s godot/assets/lume_cafe_hd.png)" -gt 2000000

          IMPORT_LOG=/tmp/godot-import.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit 2>&1 | tee "$IMPORT_LOG"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Error importing|ERR_FILE_CORRUPT" "$IMPORT_LOG"; then
            exit 1
          fi

          RUNTIME_LOG=/tmp/godot-runtime.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --quit-after 5 2>&1 | tee "$RUNTIME_LOG"
          grep -q "MYU_HD_FILE_READY" "$RUNTIME_LOG"
          grep -q "MYU_HD_SOURCE_SIZE=(1672, 941)" "$RUNTIME_LOG"
          grep -q "MYU_PIXEL_BACKGROUND_READY" "$RUNTIME_LOG"
          grep -q "MYU_HD_BACKGROUND_READY" "$RUNTIME_LOG"
          grep -q "MYU_COLLISION_READY" "$RUNTIME_LOG"
          grep -q "MYU_DEPTH_READY" "$RUNTIME_LOG"
          grep -q "MYU_PIXEL_PLAYER_READY" "$RUNTIME_LOG"
          grep -q "MYU_ANIMATED_PLAYER_READY" "$RUNTIME_LOG"
          grep -q "MYU_PLAYER_SHADOW_READY" "$RUNTIME_LOG"
          grep -q "MYU_REFLECTIONS_READY" "$RUNTIME_LOG"
          grep -q "MYU_POLISH_READY" "$RUNTIME_LOG"
          grep -q "MYU_RAIN_READY" "$RUNTIME_LOG"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to decode|failed to decode|invalid base64|WebP decode failed|animated sprite sheet failed|failed to load HD|Invalid call|Invalid access" "$RUNTIME_LOG"; then
            exit 1
          fi

          EXPORT_LOG=/tmp/godot-export.log
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/_site/godot/index.html" 2>&1 | tee "$EXPORT_LOG"
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|Invalid access|Export failed" "$EXPORT_LOG"; then
            exit 1
          fi
          test -f _site/godot/index.html
          test -f _site/godot/index.wasm
          test -f _site/godot/index.pck
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
