name: Deploy MYU v10 to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare MYU v10
        shell: bash
        run: |
          rm -rf _site _extract _extract_v10
          mkdir -p _site _extract _extract_v10
          unzip -q MYU_17_40_prototype_v10.zip -d _extract
          if [ -d "_extract/MYU_17_40_prototype_v10" ]; then
            cp -a _extract/MYU_17_40_prototype_v10/. _site/
          else
            cp -a _extract/. _site/
          fi
          mkdir -p _site/v10
          unzip -q MYU_17_40_prototype_v10.zip -d _extract_v10
          if [ -d "_extract_v10/MYU_17_40_prototype_v10" ]; then
            cp -a _extract_v10/MYU_17_40_prototype_v10/. _site/v10/
          else
            cp -a _extract_v10/. _site/v10/
          fi
          test -f _site/index.html
          test -f _site/game.js
          test -f _site/assets/backgrounds/interior.webp
          test -f _site/v10/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
