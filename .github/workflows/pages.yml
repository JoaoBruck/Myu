name: Deploy MYU + Street Lab v3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Prepare stable root
        shell: bash
        run: |
          rm -rf _site _stable _lab
          mkdir -p _site _stable _lab
          unzip -q MYU_17_40_prototype_v15.zip -d _stable
          cp -a _stable/MYU_17_40_prototype_v15/. _site/

      - name: Prepare street lab v3
        shell: bash
        run: |
          unzip -q MYU_outdoor_lab_v3.zip -d _lab
          mkdir -p _site/phaser _site/streetlab
          cp -a _lab/myu_streetlab_v3/. _site/phaser/
          cp -a _lab/myu_streetlab_v3/. _site/streetlab/

          test -f _site/phaser/app.js
          test -f _site/phaser/test_report.txt
          grep -q 'maxSpeed:58' _site/phaser/app.js
          grep -q 'BUILDING_HITBOXES' _site/phaser/app.js
          grep -q 'WALK_POLY' _site/phaser/app.js
          grep -q 'outside x=600 y=900 blocked' _site/phaser/test_report.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
