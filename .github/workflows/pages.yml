name: Deploy MYU + Phaser Rebuild

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      - name: Prepare stable MYU root
        shell: bash
        run: |
          rm -rf _site _stable _phaser
          mkdir -p _site _stable _phaser
          unzip -q MYU_17_40_prototype_v15.zip -d _stable
          if [ -d "_stable/MYU_17_40_prototype_v15" ]; then
            cp -a _stable/MYU_17_40_prototype_v15/. _site/
          else
            cp -a _stable/. _site/
          fi

      - name: Prepare Phaser rebuild
        shell: bash
        run: |
          unzip -q MYU_17_40_phaser_v1.zip -d _phaser
          mkdir -p _site/phaser _site/v16
          if [ -d "_phaser/MYU_17_40_phaser_v1" ]; then
            cp -a _phaser/MYU_17_40_phaser_v1/. _site/phaser/
            cp -a _phaser/MYU_17_40_phaser_v1/. _site/v16/
          else
            cp -a _phaser/. _site/phaser/
            cp -a _phaser/. _site/v16/
          fi

          test -f _site/index.html
          test -f _site/phaser/index.html
          test -f _site/phaser/src/main.js
          test -f _site/phaser/assets/backgrounds/exterior.webp
          test -f _site/phaser/assets/foreground/int_table_center.png
          test -f _site/v16/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
